<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" width="400" height="225">
  <defs>
    <linearGradient id="medSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="40%" stop-color="#312e81"/>
      <stop offset="75%" stop-color="#c026d3"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="medSun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="medRoad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <filter id="medGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Twilight Sky & Soft Lighting -->
  <rect width="400" height="225" fill="url(#medSky)"/>
  <circle cx="280" cy="90" r="32" fill="url(#medSun)" filter="url(#medGlow)" opacity="0.85"/>

  <!-- Distant Soft Hills -->
  <path d="M0,135 Q70,90 150,120 T300,105 T400,135 L400,225 L0,225 Z" fill="#431407" opacity="0.4"/>
  <path d="M0,140 Q90,105 180,130 T360,118 T400,140 L400,225 L0,225 Z" fill="#2e1065" opacity="0.7"/>

  <!-- Modern City Skyline with Soft Light Windows -->
  <g opacity="0.85">
    <rect x="25" y="80" width="38" height="65" rx="3" fill="#18181b"/>
    <rect x="32" y="88" width="4" height="6" fill="#fde047" opacity="0.7"/>
    <rect x="42" y="88" width="4" height="6" fill="#fde047" opacity="0.5"/>
    <rect x="52" y="98" width="4" height="6" fill="#38bdf8" opacity="0.6"/>

    <rect x="70" y="62" width="44" height="83" rx="3" fill="#09090b"/>
    <rect x="78" y="70" width="5" height="7" fill="#f43f5e" opacity="0.8"/>
    <rect x="90" y="70" width="5" height="7" fill="#fde047" opacity="0.7"/>
    <rect x="100" y="85" width="5" height="7" fill="#38bdf8" opacity="0.8"/>

    <rect x="120" y="90" width="32" height="55" rx="3" fill="#1c1917"/>

    <rect x="235" y="72" width="48" height="73" rx="3" fill="#09090b"/>
    <rect x="245" y="80" width="6" height="8" fill="#fde047" opacity="0.8"/>
    <rect x="260" y="95" width="6" height="8" fill="#a855f7" opacity="0.8"/>

    <rect x="290" y="85" width="42" height="60" rx="3" fill="#18181b"/>
    <rect x="340" y="68" width="45" height="77" rx="3" fill="#0f172a"/>
  </g>

  <!-- Ground Plane & Curving Asphalt Road -->
  <polygon points="0,142 400,142 400,225 0,225" fill="#050508"/>
  <polygon points="155,142 245,142 340,225 60,225" fill="url(#medRoad)"/>

  <!-- Road Reflection Sheen -->
  <polygon points="180,142 220,142 280,225 120,225" fill="url(#medSun)" opacity="0.08"/>

  <!-- Road Dashes with Perspective -->
  <polygon points="198,146 202,146 203,165 197,165" fill="#e2e8f0" opacity="0.75"/>
  <polygon points="196,174 204,174 206,204 194,204" fill="#e2e8f0" opacity="0.85"/>

  <!-- Coastal Palm Silhouettes -->
  <path d="M42,205 Q44,170 38,145" stroke="#1c1917" stroke-width="4" fill="none"/>
  <circle cx="38" cy="144" r="14" fill="#064e3b" opacity="0.9"/>
  <path d="M365,200 Q362,168 368,142" stroke="#1c1917" stroke-width="4" fill="none"/>
  <circle cx="368" cy="140" r="15" fill="#064e3b" opacity="0.9"/>

  <!-- Badge Overlay -->
  <rect x="12" y="12" width="68" height="22" rx="6" fill="#a855f7" opacity="0.9"/>
  <text x="46" y="27" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">MEDIUM</text>
  <rect x="296" y="12" width="92" height="22" rx="6" fill="rgba(0,0,0,0.65)"/>
  <text x="342" y="27" font-family="monospace" font-size="10" font-weight="700" fill="#c084fc" text-anchor="middle">⚖️ BALANCED</text>
</svg>
