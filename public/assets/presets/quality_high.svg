<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" width="400" height="225">
  <defs>
    <linearGradient id="hiSky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="35%" stop-color="#1e1b4b"/>
      <stop offset="65%" stop-color="#4c0519"/>
      <stop offset="85%" stop-color="#db2777"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="hiNeon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="hiRoad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="60%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <filter id="hiGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <radialGradient id="hiSunFlare" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#f43f5e" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#4c0519" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Deep Dramatic Night/Dusk Sky -->
  <rect width="400" height="225" fill="url(#hiSky)"/>

  <!-- Dramatic Sun Flare & Volumetric Light Rays -->
  <circle cx="210" cy="115" r="90" fill="url(#hiSunFlare)" filter="url(#hiGlow)" opacity="0.9"/>
  <polygon points="210,115 -50,-20 90,-40" fill="#fde047" opacity="0.12"/>
  <polygon points="210,115 150,-40 320,-30" fill="#f43f5e" opacity="0.15"/>
  <polygon points="210,115 380,-10 450,80" fill="#ec4899" opacity="0.14"/>

  <!-- Cyberpunk Coastal Skyline with Vibrant Neon Edge Lines -->
  <g>
    <!-- Building 1 Left -->
    <rect x="20" y="70" width="42" height="75" rx="3" fill="#090d16" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.8"/>
    <line x1="20" y1="78" x2="62" y2="78" stroke="#06b6d4" stroke-width="1.5" opacity="0.9"/>
    <!-- Windows -->
    <rect x="28" y="86" width="6" height="8" fill="#38bdf8" filter="url(#hiGlow)"/>
    <rect x="44" y="86" width="6" height="8" fill="#38bdf8"/>
    <rect x="28" y="104" width="6" height="8" fill="#ec4899" filter="url(#hiGlow)"/>
    <rect x="44" y="104" width="6" height="8" fill="#38bdf8"/>

    <!-- Building 2 Tall Left -->
    <rect x="68" y="45" width="46" height="100" rx="4" fill="#030712" stroke="#ec4899" stroke-width="1.5" stroke-opacity="0.9"/>
    <line x1="68" y1="52" x2="114" y2="52" stroke="#ec4899" stroke-width="2"/>
    <rect x="76" y="60" width="7" height="10" fill="#ec4899" opacity="0.9"/>
    <rect x="94" y="60" width="7" height="10" fill="#fbbf24"/>
    <rect x="76" y="80" width="7" height="10" fill="#38bdf8"/>
    <rect x="94" y="80" width="7" height="10" fill="#ec4899"/>
    <rect x="76" y="100" width="7" height="10" fill="#38bdf8"/>
    <rect x="94" y="100" width="7" height="10" fill="#38bdf8"/>

    <!-- Center Spire -->
    <polygon points="125,50 135,145 115,145" fill="#090d16" stroke="#3b82f6" stroke-width="1"/>
    <circle cx="125" cy="48" r="4" fill="#f43f5e" filter="url(#hiGlow)"/>

    <!-- Building 3 Right Tall -->
    <rect x="275" y="52" width="48" height="93" rx="4" fill="#030712" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="275" y1="60" x2="323" y2="60" stroke="#38bdf8" stroke-width="2"/>
    <rect x="284" y="70" width="8" height="10" fill="#38bdf8"/>
    <rect x="302" y="70" width="8" height="10" fill="#ec4899" filter="url(#hiGlow)"/>
    <rect x="284" y="92" width="8" height="10" fill="#facc15"/>
    <rect x="302" y="92" width="8" height="10" fill="#38bdf8"/>

    <!-- Building 4 Right -->
    <rect x="330" y="65" width="44" height="80" rx="3" fill="#090d16" stroke="#a855f7" stroke-width="1.5"/>
    <line x1="330" y1="74" x2="374" y2="74" stroke="#a855f7" stroke-width="1.5"/>
    <rect x="340" y="82" width="6" height="8" fill="#c084fc"/>
    <rect x="356" y="82" width="6" height="8" fill="#f43f5e"/>
  </g>

  <!-- Wet Asphalt Road with Neon SSR Reflections -->
  <polygon points="0,145 400,145 400,225 0,225" fill="#02040a"/>
  <polygon points="150,145 250,145 355,225 45,225" fill="url(#hiRoad)"/>

  <!-- High Quality SSR Light Streaks on Road -->
  <polygon points="175,145 195,145 180,225 110,225" fill="#06b6d4" opacity="0.35" filter="url(#hiGlow)"/>
  <polygon points="205,145 220,145 260,225 210,225" fill="#ec4899" opacity="0.4" filter="url(#hiGlow)"/>
  <polygon points="225,145 238,145 310,225 270,225" fill="#fbbf24" opacity="0.3" filter="url(#hiGlow)"/>

  <!-- Center Road Dashes Glowing -->
  <polygon points="198,148 202,148 203,166 197,166" fill="#ffffff" filter="url(#hiGlow)"/>
  <polygon points="196,175 204,175 207,206 193,206" fill="#ffffff" filter="url(#hiGlow)"/>

  <!-- Neon Light Bar Trim -->
  <rect x="0" y="143" width="400" height="2" fill="url(#hiNeon)" opacity="0.75" filter="url(#hiGlow)"/>

  <!-- Badges -->
  <rect x="12" y="12" width="60" height="22" rx="6" fill="#f43f5e" opacity="0.95"/>
  <text x="42" y="27" font-family="system-ui, sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">HIGH</text>
  <rect x="290" y="12" width="98" height="22" rx="6" fill="rgba(0,0,0,0.7)"/>
  <text x="339" y="27" font-family="monospace" font-size="10" font-weight="800" fill="#f43f5e" text-anchor="middle">✨ ULTRA HDR</text>
</svg>
