<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Aazhi — Island Vertical Slice</title>
  <meta name="description" content="A compact, walkable Three.js recreation of the Kerala-inspired island reference with elevated metro station, waterfront café, and procedural vegetation." />
  <meta property="og:title" content="Aazhi — Island Vertical Slice" />
  <meta property="og:description" content="A compact, walkable Three.js recreation of the Kerala-inspired island reference with elevated metro station, waterfront café, and procedural vegetation." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --ink: #fdf6ea; --panel: rgba(18, 28, 36, 0.62); --accent: #37c3c0; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #090d16; overscroll-behavior: none; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }

    /* Dev Debug Panel Styles (Toggled by the top-center Dev Debug button) */
    #wind-debug {
      position: fixed; top: 38px; left: 50%; transform: translateX(-50%);
      width: 300px; max-height: calc(100vh - 96px); overflow-y: auto;
      color: var(--ink); background: rgba(10, 14, 23, 0.92);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 14px;
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.65);
      font-size: 11.5px; user-select: none;
      z-index: 60;
      display: none;
    }
    #wind-debug.open { display: flex; flex-direction: column; }
    #wind-debug-hdr {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      cursor: grab;
      font-weight: 700; font-size: 10.5px; letter-spacing: 0.06em;
      color: var(--accent);
      flex-shrink: 0;
    }
    #wind-debug-hdr:active { cursor: grabbing; }
    #wind-debug-close {
      background: transparent; border: none; color: #c7d4dc;
      font-size: 16px; line-height: 1; padding: 1px 6px;
      border-radius: 4px; cursor: pointer;
    }
    #wind-debug-close:hover { color: #fff; background: rgba(255, 255, 255, 0.12); }
    .wd-body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }
    .wd-presets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
    .wd-presets button {
      background: rgba(255, 255, 255, 0.08);
      color: #e2ecef;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 5px;
      padding: 4px 2px;
      font: 600 10px/1.1 'Outfit', system-ui, sans-serif;
      cursor: pointer;
      transition: background 0.12s, border-color 0.12s, color 0.12s;
    }
    .wd-presets button:hover { background: rgba(255, 255, 255, 0.16); }
    .wd-presets button.active {
      background: rgba(55, 195, 192, 0.22);
      border-color: var(--accent);
      color: #7bf2ef;
    }
    .opt-desc {
      margin-top: 2px; font-size: 10px; line-height: 1.4;
      color: #b8cad2; background: rgba(255, 255, 255, 0.05);
      border-radius: 5px; padding: 5px 7px;
    }
    .wd-row { display: flex; flex-direction: column; gap: 2px; }
    .wd-lbl { display: flex; justify-content: space-between; font-size: 10.5px; color: #cfdce2; font-variant-numeric: tabular-nums; }
    .wd-lbl span:last-child { color: var(--accent); font-weight: 600; }
    .wd-row input[type="range"] {
      width: 100%; height: 4px; margin: 2px 0;
      accent-color: var(--accent); cursor: pointer;
    }
    .wd-sec { margin-top: 4px; font-size: 9.5px; letter-spacing: 0.09em; text-transform: uppercase; color: #8fb4bf; display: flex; justify-content: space-between; align-items: center; }
    .wd-read { font-size: 10.5px; line-height: 1.5; color: #e2ecef; background: rgba(255,255,255,0.05); border-radius: 6px; padding: 6px 8px; font-variant-numeric: tabular-nums; }
    .wd-read b { color: #7bf2ef; font-weight: 600; }
    .wd-chk { display: flex; align-items: center; gap: 6px; font-size: 10.5px; color: #cfdce2; cursor: pointer; }
    .wd-chk input { accent-color: var(--accent); margin: 0; }
    .wd-two { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
    .wd-two input, .wd-two select { min-width: 0; background: rgba(255,255,255,0.08); color: #e2ecef; border: 1px solid rgba(255,255,255,0.14); border-radius: 5px; padding: 3px 4px; font: 500 10.5px 'Outfit', system-ui, sans-serif; color-scheme: dark; }
    .wd-wx { grid-template-columns: repeat(3, 1fr); }
    .wd-btn, .wd-mini { background: rgba(255,255,255,0.08); color: #e2ecef; border: 1px solid rgba(255,255,255,0.14); border-radius: 5px; padding: 4px 2px; font: 600 10px/1.1 'Outfit', system-ui, sans-serif; cursor: pointer; }
    .wd-btn:hover, .wd-mini:hover { background: rgba(255,255,255,0.16); }
    .wd-mini { padding: 2px 6px; font-size: 9px; text-transform: none; letter-spacing: 0; }
    .wd-lbl span.auto { color: #7d939b !important; font-weight: 400 !important; }

    @media (max-width: 640px) {
      #wind-debug {
        inset: 0 !important;
        top: 0 !important; left: 0 !important; right: 0 !important; bottom: 0 !important;
        transform: none !important;
        width: 100vw !important;
        height: 100vh !important;
        height: 100dvh !important;
        max-height: none !important;
        border-radius: 0 !important;
        border: none !important;
        background: rgba(10, 14, 23, 0.96);
        z-index: 70;
      }
      #wind-debug-hdr {
        padding: 12px 14px;
        font-size: 11.5px;
        cursor: default;
        background: rgba(18, 30, 40, 0.9);
      }
      #wind-debug-close {
        font-size: 20px;
        padding: 4px 10px;
      }
      .wd-body {
        flex: 1;
        padding: 12px 14px 28px;
        gap: 10px;
      }
    }

    #loading { position: fixed; inset: 0; display: grid; place-items: center; background: linear-gradient(#4f8fcf, #f3d9b5);
      color: #fff; font-size: 15px; letter-spacing: .1em; transition: opacity .5s; z-index: 100; pointer-events: none; }
  </style>
</head>
<body>
  <div id="loading">BUILDING ISLAND…</div>
  <div id="root"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
