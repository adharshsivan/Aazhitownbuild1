<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Aazhi — Island Vertical Slice</title>
  <meta name="description" content="A compact, walkable Three.js recreation of the Kerala-inspired island reference with elevated metro station, waterfront café, and procedural vegetation." />
  <meta property="og:title" content="Aazhi — Island Vertical Slice" />
  <meta property="og:description" content="A compact, walkable Three.js recreation of the Kerala-inspired island reference with elevated metro station, waterfront café, and procedural vegetation." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #fdf6ea;
      --panel: #121c249e;
      --accent: #37c3c0;
    }
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      overscroll-behavior: none;
      background: #090d16;
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }
    canvas {
      touch-action: none;
      width: 100%;
      height: 100%;
      display: block;
    }
    #loading {
      color: #fff;
      letter-spacing: .1em;
      z-index: 100;
      pointer-events: none;
      background: linear-gradient(#4f8fcf, #f3d9b5);
      place-items: center;
      font-size: 15px;
      transition: opacity .5s;
      display: grid;
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      right: 0;
    }
  </style>
</head>
<body>
  <div id="loading">BUILDING ISLAND…</div>
  <div id="root"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
